# ── Configuration Netlify — digijohnia.solutions ──────────────────────────────
# Ce fichier pilote le déploiement automatique. NE PAS MODIFIER sauf si DIAS le demande.

[build]
  publish = "."        # Déploie tout le dossier racine du repo

# ── Redirections propres (URLs sans .html) ─────────────────────────────────────
# Chaque nouvel outil est dans son propre dossier /nom-outil/index.html
# → URL finale : digijohnia.solutions/nom-outil  (sans slash ni extension)

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# ── En-têtes de sécurité ───────────────────────────────────────────────────────
# CSP calée sur les dépendances réelles des pages : fonts Google, cdnjs (three.js),
# jsdelivr (icônes Tabler du calculateur). Pas d'iframe tierce, pas d'objet.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me"
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Cache long pour assets statiques ──────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
